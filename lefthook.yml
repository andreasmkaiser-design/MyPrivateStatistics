pre-commit:
  parallel: false
  commands:
    format:
      run: dart format --set-exit-if-changed .
    analyze:
      run: flutter analyze --no-fatal-infos
    test:
      # Full suite and test/features/ both OOM on Windows / Dart 3.11 JIT due
      # to the widget-framework overhead. Scope to test/unit/ (pure-Dart, no
      # rendering engine) which covers all domain and algorithm logic.
      # Widget and integration tests run in GitHub Actions CI where memory is
      # not constrained. Glob skips the hook when no Dart files are staged.
      glob: "**/*.dart"
      run: flutter test test/unit/ --no-pub --concurrency=1
