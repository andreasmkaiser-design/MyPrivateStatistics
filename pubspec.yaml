name: private_statistics
description: Personal event tracking and statistical correlation for Android.
publish_to: 'none'
version: 1.0.3+3

environment:
  sdk: ^3.11.0

dependencies:
  drift: ^2.22.0
  file_picker: ^8.3.7
  firebase_core: ^3.0.0
  firebase_crashlytics: ^4.0.0
  fl_chart: ^1.2.0
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  flutter_riverpod: ^2.6.1
  health: ^12.0.0
  intl: ^0.20.2
  logger: ^2.5.0
  path: ^1.9.1
  path_provider: ^2.1.5
  riverpod_annotation: ^2.4.1
  shared_preferences: ^2.3.0
  sqlite3_flutter_libs: ^0.5.28
  workmanager: ^0.6.0

dev_dependencies:
  build_runner: ^2.4.13
  drift_dev: ^2.22.0
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  mocktail: ^1.0.4
  riverpod_generator: ^2.4.3
  very_good_analysis: ^7.0.0

flutter:
  generate: true
  uses-material-design: true
