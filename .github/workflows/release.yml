name: Release

on:
  push:
    branches: [feature/issue-2-project-scaffold]

jobs:
  release:
    name: Build & Upload to Play Store
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.41.2'
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Generate code
        run: |
          dart run build_runner build --delete-conflicting-outputs
          flutter gen-l10n

      - name: Decode keystore
        run: |
          echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 --decode > android/app/keystore.jks

      - name: Build signed AAB
        env:
          KEYSTORE_PATH: keystore.jks
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: flutter build appbundle --release

      - name: Upload to Play Store internal track
        env:
          PLAY_STORE_JSON_KEY: ${{ secrets.PLAY_STORE_JSON_KEY }}
        run: |
          pip install --quiet google-api-python-client google-auth
          echo "$PLAY_STORE_JSON_KEY" > /tmp/play-key.json
          python3 << 'PYEOF'
          import json, sys
          from google.oauth2 import service_account
          from googleapiclient.discovery import build
          from googleapiclient.http import MediaFileUpload
          from googleapiclient.errors import HttpError

          with open('/tmp/play-key.json') as f:
              info = json.load(f)

          creds = service_account.Credentials.from_service_account_info(
              info,
              scopes=['https://www.googleapis.com/auth/androidpublisher'],
          )
          service = build('androidpublisher', 'v3', credentials=creds)
          pkg = 'com.akaiser.private_statistics'

          try:
              edit = service.edits().insert(body={}, packageName=pkg).execute()
              edit_id = edit['id']
              media = MediaFileUpload(
                  'build/app/outputs/bundle/release/app-release.aab',
                  mimetype='application/octet-stream',
              )
              bundle = service.edits().bundles().upload(
                  packageName=pkg, editId=edit_id, media_body=media,
              ).execute()
              service.edits().tracks().update(
                  packageName=pkg, editId=edit_id, track='internal',
                  body={'releases': [{'status': 'completed',
                                      'versionCodes': [bundle['versionCode']]}]},
              ).execute()
              service.edits().commit(packageName=pkg, editId=edit_id).execute()
              print(f"Uploaded versionCode {bundle['versionCode']} to internal track.")
          except HttpError as e:
              print(f"Google API error {e.status_code}: {e.reason}", file=sys.stderr)
              print(e.error_details, file=sys.stderr)
              sys.exit(1)
          PYEOF
