name: Release

on:
  push:
    branches: [feature/issue-2-project-scaffold]

jobs:
  release:
    name: Build & Upload to Play Store
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.41.2'
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Generate code
        run: |
          dart run build_runner build --delete-conflicting-outputs
          flutter gen-l10n

      - name: Decode keystore
        run: |
          echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 --decode > android/app/keystore.jks

      - name: Build signed AAB
        env:
          KEYSTORE_PATH: keystore.jks
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: flutter build appbundle --release

      - name: Upload to Play Store internal track
        uses: google-github-actions/upload-play@v2
        with:
          credentials_json: ${{ secrets.PLAY_STORE_JSON_KEY }}
          package_name: com.akaiser.private_statistics
          aab: build/app/outputs/bundle/release/app-release.aab
          track: internal
